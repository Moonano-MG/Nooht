# 大规模训练目标/流程占位配置（任务包第十节）。
# 当前 train_native.py 不接入跨节点拓扑通信、DualPipe/1F1B、DeepSeek 3FS、
# Sequence Packing 或异步 Checkpointing；此配置不是可执行的大规模训练方案。
scale: large
attention: flash_attention
sequence_packing: true
parallelism:
  strategy: dualpipe_1f1b  # 或 1F1B
  topology_aware_comm: true
storage:
  filesystem: deepseek_3fs
checkpoint:
  async: true
  interval_steps: 1000
data:
  max_seq_len: 32768
  packing: true
optimizer:
  name: adamw
  lr: 2.0e-5
training:
  per_device_batch: 2
  grad_accum: 16
  bf16: true
version: v0.1.0-dev
