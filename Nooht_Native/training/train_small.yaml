# 小规模训练目标配置（任务包第十节），不是所有优化均已接入。
# train_native.py 支持请求 FlashAttention 2、BF16、batch/grad accumulation 和序列长度。
# Sequence Packing、DeepSpeed ZeRO-2/FSDP 与异步 Checkpointing 暂未实现，运行时会告警。
scale: small
attention: flash_attention
sequence_packing: true
parallelism:
  strategy: deepspeed_zero2  # 或 fsdp，二选一
checkpoint:
  async: true
  interval_steps: 500
data:
  max_seq_len: 8192
  packing: true
optimizer:
  name: adamw
  lr: 2.0e-5
training:
  per_device_batch: 4
  grad_accum: 8
  bf16: true
version: v0.1.0-dev
