name: train-noild

# Same-budget pair training, Noild side (Jamba with 2 MoE blocks replaced by NoildLayer).
# Seeds 0, 1, 2 run as parallel jobs. A newer push cancels the older in-progress run of the same seed.
# Hard limit: job timeout 60 min; the script also stops training after --max_minutes (45).

on:
  push:
    branches: [v0.1.0-dev, arena/9241b18b-nooht]
    paths:
      - "scripts/pair_train/**"
      - ".github/workflows/train-noild.yml"
  workflow_dispatch:
    inputs:
      steps:
        description: "training steps (must match train-native)"
        required: false
        default: "2000"

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        seed: [0, 1, 2]
    concurrency:
      group: train-noild-seed${{ matrix.seed }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      STEPS: ${{ inputs.steps || '2000' }}
      SEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install "transformers==5.24.0"

      - name: Build corpus (runtime, not committed)
        run: python scripts/pair_train/build_corpus.py --out train-out/corpus.bin

      - name: Train Noild
        run: |
          set -o pipefail
          python -W ignore scripts/pair_train/train.py \
            --arch noild --seed "$SEED" --steps "$STEPS" --eval_every 100 \
            --corpus train-out/corpus.bin --threads "$(nproc)" --max_minutes 45 \
            --out train-out/res_noild_s${SEED}.json 2>&1 | tee train-out/log_noild_s${SEED}.txt

      - name: Report (annotations are readable via the API)
        if: always()
        run: |
          python - <<'EOF'
          import glob, json, os
          for f in glob.glob("train-out/res_noild_*.json"):
              r = json.load(open(f))
              print(f"::notice title=noild seed {r['seed']} result::status={r['status']} steps_done={r['steps_done']}/{r['steps_requested']} params={r['params']} wall_s={r['wall_s']} cpu_count={os.cpu_count()} torch={r['torch']}")
              print(f"::notice title=noild seed {r['seed']} final::final_val={r['final_val']} best_val={r['best_val']} best_step={r['best_step']}")
              curve = " ".join(f"{x['step']}:{x['val_loss']}" for x in r["log"])
              print(f"::notice title=noild seed {r['seed']} val curve::{curve}")
          EOF

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: train-noild-seed${{ matrix.seed }}
          path: |
            train-out/res_noild_*.json
            train-out/log_noild_*.txt
          if-no-files-found: warn
          retention-days: 14
